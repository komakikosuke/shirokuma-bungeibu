name: Test note magazine synchronization

on:
  push:
    branches: [main]
    paths:
      - "scripts/note_magazine_sync.py"
      - "tests/test_note_magazine_sync.py"
      - ".github/workflows/test-magazine-sync.yml"
  pull_request:
    paths:
      - "scripts/note_magazine_sync.py"
      - "tests/test_note_magazine_sync.py"
      - ".github/workflows/test-magazine-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_note_magazine_sync.py -v
