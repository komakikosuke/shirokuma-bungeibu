name: Build OGP preview image

# OGP preview is finalized; regenerate only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shirokuma-ogp-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages Pillow
      - name: Validate and render 1200x630 JPEG card
        run: python3 scripts/build-ogp.py
      - name: Commit OGP image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ogp-bear-preview-medium-20261108.jpg
          if git diff --cached --quiet; then
            echo "OGP preview unchanged"
          else
            git commit -m "Render uncropped horizontal OGP preview"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main
              sleep 2
            done
            exit 1
          fi
