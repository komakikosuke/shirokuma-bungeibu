name: Discover first-comment candidates

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync-candidates.py"
      - "scripts/build-magazine-eligible.py"
      - ".github/workflows/sync-candidates.yml"
  schedule:
    # JST 00:30, 06:30, 12:30, 18:30
    - cron: "30 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: shirokuma-candidate-discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Discover public first-comment candidates
        run: python3 scripts/sync-candidates.py
      - name: Prepare site-published works for future magazine automation
        run: python3 scripts/build-magazine-eligible.py
      - name: Save discovered candidates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/candidate-discovery-cache.json data/magazine-eligible.json
          if git diff --cached --quiet; then
            echo "No candidate changes."
          else
            git commit -m "Refresh discovered first-comment candidate list"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main
              sleep 2
            done
            exit 1
          fi
