name: Validate and sync prefecture creator atlas

on:
  workflow_dispatch:
  push:
    branches: [main, feature/prefecture-atlas]
    paths:
      - "prefectures/**"
      - "scripts/sync_prefecture_atlas.py"
      - "scripts/build_prefecture_atlas_debug.py"
      - "tests/test_prefecture_atlas*"
      - ".github/workflows/sync-prefecture-atlas.yml"
  pull_request:
    paths:
      - "prefectures/**"
      - "scripts/sync_prefecture_atlas.py"
      - "scripts/build_prefecture_atlas_debug.py"
      - "tests/test_prefecture_atlas*"
      - ".github/workflows/sync-prefecture-atlas.yml"
  schedule:
    # Cron activates on the default branch after release.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: prefecture-atlas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check collection rules and UI data model
        run: |
          python3 -m unittest discover -s tests -p 'test_prefecture_atlas*.py' -v
          node --test tests/test_prefecture_atlas.mjs
          node --check prefectures/app.js
  sync:
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect articles with both required hashtags
        run: python3 scripts/sync_prefecture_atlas.py
      - name: Refresh the separate Komaki debug feed
        continue-on-error: true
        run: python3 scripts/build_prefecture_atlas_debug.py
      - name: Save successfully collected data to the same branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prefecture-atlas.json
          if [ -f data/prefecture-atlas-debug.json ]; then
            git add data/prefecture-atlas-debug.json
          fi
          if git diff --cached --quiet; then
            echo "No atlas changes."
            exit 0
          fi
          git commit -m "Refresh prefecture creator atlas articles"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 2
          done
          exit 1
