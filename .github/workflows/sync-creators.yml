name: Refresh featured creator display names

on:
  workflow_dispatch:
  push:
    paths:
      - "data/works.json"
      - "data/candidates.json"
      - "scripts/sync-creators.py"
      - ".github/workflows/sync-creators.yml"
  schedule:
    # After the site's four daily data sync windows (JST 00:40, 06:40, 12:40, 18:40)
    - cron: "40 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: shirokuma-creators
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current public creator display names
        run: python3 scripts/sync-creators.py
      - name: Commit updated display names
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/creators.json
          if git diff --cached --quiet; then
            echo "Creator names unchanged"
          else
            git commit -m "Update public creator display names"
            git push
          fi
